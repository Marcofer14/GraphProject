name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        shell: bash
        run: |
          set +e
          uv run pytest --cov=neural_routing --cov-report=term-missing 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # surface the failure as an annotation, visible on the commit without opening the log
            echo "::error title=pytest exit $status::$(tail -c 3500 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $status
