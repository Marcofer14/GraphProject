# Cloudflare Worker for the demo's "Ask the project" chat (deploy guide: chat/README.md).
name = "neural-routing-chat"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# knowledge.md is bundled into the Worker as a string
rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

# Cloudflare Workers AI: the free fallback when Groq is unavailable or out of quota
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://marcofer14.github.io,http://localhost:5173,http://127.0.0.1:5173"
# Groq models tried in order; the free (developer) plan offers these, check console.groq.com/docs/models
GROQ_MODELS = "openai/gpt-oss-120b,openai/gpt-oss-20b"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# `npx wrangler dev --env local`: test on this machine without a Cloudflare login (no Workers AI;
# a Groq key can go in .dev.vars, which is git-ignored)
[env.local.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
GROQ_MODELS = "openai/gpt-oss-120b,openai/gpt-oss-20b"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
