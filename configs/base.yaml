# Shared defaults; problem configs override what they need.
problem: tsp
num_customers: 20

model:
  embed_dim: 128
  num_heads: 8
  num_layers: 6
  ff_dim: 512
  norm: instance
  tanh_clip: 10.0

train:
  baseline: pomo          # pomo | rollout
  num_starts: null        # POMO starts per instance; null = one per customer
  epochs: 30
  steps_per_epoch: 500
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  val_size: 1000
  log_every: 20
  seed: 0
  device: auto
  resume: auto            # auto = continue from checkpoints/<tag>_last.pt if present | null | path
  run_dir: runs/${problem}${num_customers}_${train.baseline}/${now:%Y%m%d-%H%M%S}
  checkpoint_dir: checkpoints

hydra:
  run:
    dir: ${train.run_dir}
  job:
    chdir: false
