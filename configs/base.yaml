# Shared defaults; problem configs override what they need.
problem: tsp
num_customers: 20

data:
  distribution: uniform   # uniform (Kool et al.) | amazon (calibrated, configs/generator/amazon.json)
  generator_params: configs/generator/amazon.json
  stops_per_vehicle: null # amazon only: rescale demands so a van holds ~this many stops
  normalisation: all      # all | customers (scale by the customers' box; use model.depot_encoding=polar)

model:
  embed_dim: 128
  num_heads: 8
  num_layers: 6
  ff_dim: 512
  norm: instance
  tanh_clip: 10.0
  depot_encoding: xy      # xy | polar (direction + log-distance from the customer centroid)

train:
  baseline: pomo          # pomo | rollout
  num_starts: null        # POMO starts per instance; null = one per customer
  epochs: 30
  steps_per_epoch: 500
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  val_size: 1000
  log_every: 20
  seed: 0
  device: auto
  resume: auto            # auto = continue from checkpoints/<tag>_last.pt if present | null | path
  early_stopping:         # stop after `patience` epochs without a >= min_rel_delta improvement
    patience: 8           # null disables it; `epochs` is then just an upper bound
    min_rel_delta: 0.001  # 0.1 % relative to the best validation length so far
  run_dir: runs/${problem}${num_customers}_${train.baseline}/${now:%Y%m%d-%H%M%S}
  checkpoint_dir: checkpoints
  tag: null               # checkpoint name; default <problem><n>_<baseline>[_<distribution>]

hydra:
  run:
    dir: ${train.run_dir}
  job:
    chdir: false
