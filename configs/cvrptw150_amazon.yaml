# Curriculum stage 3/3: CVRPTW-150, the size of a real van route, warm-started from CVRPTW-100.
# Measured on the GTX 1660 Super: batch 16 x 150 starts ~3.3 GB, ~1.9 s/step -> ~8 min/epoch.
defaults:
  - cvrptw50_amazon
  - _self_

num_customers: 150

train:
  tag: cvrptw150_pomo_amazon
  init_from: checkpoints/cvrptw100_pomo_amazon.pt
  batch_size: 16
  steps_per_epoch: 250
  epochs: 25
  val_size: 200
