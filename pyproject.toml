[project]
name = "neural-routing"
version = "0.1.0"
description = "Neural last-mile routing: deep RL solvers for CVRPTW benchmarked on real Amazon delivery routes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "ijson>=3.3",
    "ortools>=9.11",
    "pyvrp>=0.10",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "tabulate>=0.10.0",
    "torch>=2.5",
    "hydra-core>=1.3",
    "tensorboard>=2.18",
]

# CUDA build on the Windows dev box (GTX 1660 Super, sm_75); CPU build elsewhere (CI)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4",
    "pandas-stubs",
    "jupyter>=1.1",
    "nbconvert>=7",
    "seaborn>=0.13",
]

[project.scripts]
nr-etl = "neural_routing.data.amazon_etl:main"
nr-bench = "neural_routing.eval.benchmark:main"
nr-train = "neural_routing.ml.train:main"
nr-bench-synth = "neural_routing.eval.synthetic_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_routing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "N812"]  # math-style names (D, N, Q), torch's `F` convention

[tool.ruff.lint.isort]
known-first-party = ["neural_routing"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "E702", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
